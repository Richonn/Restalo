name: CI - Modular

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - '*'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-job:
    uses: ./.github/workflows/build.yml

  unit-tests-job:
    uses: ./.github/workflows/unit-tests.yml
    needs: build-job

  linting-job:
    uses: ./.github/workflows/linting.yml
    needs: unit-tests-job

  summary-job:
    uses: ./.github/workflows/summary.yml
    needs: [build-job, unit-tests-job, linting-job]
    if: always()
    with:
      build-result: ${{ needs.build-job.result }}
      unit-tests-result: ${{ needs.unit-tests-job.result }}
      linting-result: ${{ needs.linting-job.result }}
